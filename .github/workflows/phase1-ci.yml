name: Phase-1 CI

on:
  push:
    branches:
      - main
      - 'chatgpt/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend build, lint, migrations and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fpo_saas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fpo_saas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://fpo_app_user:changeme@localhost:5432/fpo_saas
      DATABASE_SSL: 'false'
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters-long
      REDIS_URL: redis://localhost:6379
      ALLOWED_ORIGINS: http://localhost:5173
      FPO_CODE_FORMAT: FPO-{seq:6}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Create least-privilege application database role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d fpo_saas -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'fpo_app_user') THEN
              CREATE ROLE fpo_app_user
                LOGIN
                PASSWORD 'changeme'
                NOSUPERUSER
                NOCREATEDB
                NOCREATEROLE
                NOINHERIT
                NOBYPASSRLS;
            END IF;
          END
          $$;
          GRANT CONNECT ON DATABASE fpo_saas TO fpo_app_user;
          GRANT USAGE, CREATE ON SCHEMA public TO fpo_app_user;
          CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          SQL
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - run: npm run lint
      - run: npm run migration:run
      - run: npm run test -- --no-file-parallelism

  frontend:
    name: Frontend build and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
